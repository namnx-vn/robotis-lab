name: Python offline validation
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify project structure
        run: python tools/verify_project.py
      - name: Run offline unit and fake-Webots integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q simulation/webots/controllers tools tests
